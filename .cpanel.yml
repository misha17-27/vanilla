---
deployment:
  tasks:
    - export DEPLOYPATH=/home/vanilla/public_html
    - export SRC=/home/vanilla/repositories/vanilla/site
    - /bin/mkdir -p $DEPLOYPATH/data/backups
    - /bin/mkdir -p $DEPLOYPATH/uploads/designs
    - /bin/mkdir -p $DEPLOYPATH/uploads/ratelimit
    - /bin/cp -R $SRC/admin $SRC/assets $SRC/includes $SRC/lang $DEPLOYPATH/
    - /bin/cp -f $SRC/about.php $SRC/bento.php $SRC/cake-to-go.php $SRC/category.php $DEPLOYPATH/
    - /bin/cp -f $SRC/contact.php $SRC/faq.php $SRC/fillings.php $SRC/index.php $DEPLOYPATH/
    - /bin/cp -f $SRC/konstruktor.php $SRC/mehsul.php $SRC/order-save.php $DEPLOYPATH/
    - /bin/cp -f $SRC/reviews.php $SRC/router.php $SRC/sitemap.php $SRC/upload-design.php $DEPLOYPATH/
    - /bin/cp -f $SRC/.htaccess $SRC/.user.ini $SRC/robots.txt $SRC/favicon.ico $DEPLOYPATH/
    - /bin/cp -Rn $SRC/data/. $DEPLOYPATH/data/
    - /bin/cp -f $SRC/data/.htaccess $DEPLOYPATH/data/.htaccess
    - /bin/cp -f $SRC/uploads/designs/.htaccess $DEPLOYPATH/uploads/designs/.htaccess
    - /bin/cp -f $SRC/uploads/ratelimit/.htaccess $DEPLOYPATH/uploads/ratelimit/.htaccess
    - /bin/chmod -R 755 $DEPLOYPATH/data $DEPLOYPATH/uploads
